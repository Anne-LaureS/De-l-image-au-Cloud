# default.conf — server block durci pour bc/demo-web
# Remplace /etc/nginx/conf.d/default.conf de l'image nginxinc/nginx-unprivileged

server {
    listen 8080;
    server_name _;

    # --- Durcissement de base ---------------------------------------------
    # Supprime "Server: nginx/1.x.y" des réponses et pages d'erreur
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Interdit tout fichier/dossier commençant par un point
    # (.git, .env, .htpasswd, .DS_Store, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # --- En-têtes de sécurité OWASP Secure Headers Project ------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Pas de listing de répertoire, pas d'exécution CGI/SSI : image 100% statique
    autoindex off;
}
